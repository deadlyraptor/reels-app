{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock title %}
{% block content %}

<div class="container">
    <h1 class="is-size-1">Upload Spreadsheet</h1>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <div id="file-js" class="file has-name">
                <label class="file-label">
                    <input class="file-input" type="file" name="file" accept=".xlsx">
                    <span class="file-cta">
                        <span class="file-icon">
                            <i class="fas fa-upload"></i>
                        </span>
                        <span class="file-label">Choose file(s)</span>
                    </span>
                    <span class="file-name">No file uploaded</span>
                </label>
            </div>
            <input type="submit" value="Upload spreadsheet" class="button is-primary">
        </div>
    </form>

    <div class="content">
        <p>Spreadsheet must be an .xlsx file, not .xls</p>
    </div>

    <hr>
    <p><a href="{{ url_for('main.index') }}">Go back</a></p>
</div>
{% endblock content %}
